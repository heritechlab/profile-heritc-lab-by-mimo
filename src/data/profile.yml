bio: >-
  Saya Heri Saputra, dikenal di kanal YouTube dan media sosial sebagai Heri Tc Lab.
  Sehari-hari saya merawat infrastruktur kampus, membangun aplikasi web, dan
  mengulik sistem kelistrikan PLTS di rumah — termasuk monitoring inverter dan
  panel surya lewat Modbus.

bioLanjutan: >-
  Latar saya mencakup jaringan & server, sistem elektrikal/PLTS, dan
  pengembangan web — plus hobi otomotif yang ternyata selalu beririsan dengan
  kelistrikan dan cahaya. Di kampus STIKES Harapan Ibu Jambi saya menangani situs
  utama dan perpustakaan digital sebagai lead dev; di luar itu saya mengelola
  proyek sendiri seperti platform UMKM dan layanan hosting.

